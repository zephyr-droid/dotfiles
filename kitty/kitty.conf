# kitty.conf generated by Confitty on 2026-07-26
# Place this file at: ~/.config/kitty/kitty.conf
# Reload without restart: Ctrl+Shift+F5  |  Docs: https://sw.kovidgoyal.net/kitty/conf/
# Only settings that differ from Kitty defaults are included.

# --- Fonts ---
font_family Maple Mono NF CN
font_size 12

# --- Cursor ---
cursor_shape beam
cursor_blink_interval 0

# --- Scrollback ---
scrollback_lines 10000

# --- Mouse ---
mouse_hide_wait 1.0

# --- Performance ---
repaint_delay 3
input_delay 0
sync_to_monitor no

# --- Bell ---
enable_audio_bell no

# --- Window Layout ---
remember_window_size  no
initial_window_width  120c
initial_window_height 36c
window_border_width 0pt
window_padding_width 2
hide_window_decorations yes
confirm_os_window_close 0

# --- Tab Bar ---
tab_bar_style powerline
tab_powerline_style slanted

# --- Keyboard Shortcuts ---
map kitty_mod+left no_op
map kitty_mod+right no_op

# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include macchiato.conf
# END_KITTY_THEME
